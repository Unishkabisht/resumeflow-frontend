<div class="forgot-page">

  <div class="gradient-blob blob-1"></div>
  <div class="gradient-blob blob-2"></div>
  <div class="gradient-blob blob-3"></div>

  <div class="glass-card" *ngIf="!submitted">
    <div class="card-header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs><linearGradient id="grad" x1="2" y1="2" x2="22" y2="22"><stop stop-color="#10d99a"/><stop offset="1" stop-color="#2f8fff"/></linearGradient></defs>
        </svg>
      </div>
      <h1 class="card-title">Forgot your password?</h1>
      <p class="card-subtitle">No worries — enter your email and we'll send you a reset link.</p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="card-form">
      <div class="input-group" [class.has-error]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid">
        <input
          type="email"
          id="forgot-email"
          formControlName="email"
          placeholder=" "
          autocomplete="email"
        />
        <label for="forgot-email">Email address</label>
        <div class="input-glow"></div>
        <small *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('required')">
          Email is required
        </small>
        <small *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('email')">
          Please enter a valid email
        </small>
      </div>

      <button
        type="submit"
        class="btn-gradient"
        [disabled]="forgotForm.invalid || loading"
        [class.loading]="loading"
      >
        <span *ngIf="!loading">Send Reset Link</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <a routerLink="/login" class="back-link">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to Login
    </a>
  </div>

  <div class="glass-card success-card" *ngIf="submitted">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" width="48" height="48">
        <circle cx="12" cy="12" r="10" stroke="url(#grad2)" stroke-width="2"/>
        <path d="M8 12l3 3 5-5" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs><linearGradient id="grad2" x1="4" y1="4" x2="20" y2="20"><stop stop-color="#10d99a"/><stop offset="1" stop-color="#2f8fff"/></linearGradient></defs>
      </svg>
    </div>
    <h1 class="card-title">Check your email</h1>
    <p class="card-subtitle">We've sent a password reset link to <strong>{{ forgotForm.get('email')?.value }}</strong></p>
    <a routerLink="/login" class="btn-gradient" style="text-align:center; text-decoration:none; display:block; margin-top: 24px;">
      Back to Login
    </a>
  </div>
</div>
