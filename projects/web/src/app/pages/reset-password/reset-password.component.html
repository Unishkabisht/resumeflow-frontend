<div class="reset-page">

  <div class="gradient-blob blob-1"></div>
  <div class="gradient-blob blob-2"></div>
  <div class="gradient-blob blob-3"></div>

  <div class="glass-card">
    <div class="card-header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3" y="11" width="18" height="11" rx="2" stroke="url(#rg)" stroke-width="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4" stroke="url(#rg)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="16" r="1.5" fill="url(#rg)"/>
          <defs><linearGradient id="rg" x1="3" y1="7" x2="21" y2="22"><stop stop-color="#10d99a"/><stop offset="1" stop-color="#2f8fff"/></linearGradient></defs>
        </svg>
      </div>
      <h1 class="card-title">Set new password</h1>
      <p class="card-subtitle">Must be at least 8 characters long.</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="card-form">

      <div class="input-group" [class.has-error]="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.invalid">
        <input
          [type]="showNewPassword ? 'text' : 'password'"
          id="new-password"
          formControlName="newPassword"
          placeholder=" "
          autocomplete="new-password"
        />
        <label for="new-password">New password</label>
        <button type="button" class="eye-toggle" (click)="toggleNewPassword()" aria-label="Toggle password visibility">

          <svg *ngIf="!showNewPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>

          <svg *ngIf="showNewPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
        <small *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.hasError('required')">
          Password is required
        </small>
        <small *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.hasError('minlength')">
          Must be at least 8 characters
        </small>
      </div>

      <div class="strength-meter" *ngIf="resetForm.get('newPassword')?.value">
        <div class="strength-bars">
          <div class="strength-bar" [class.active]="passwordStrength.level >= 1" [style.background]="passwordStrength.level >= 1 ? passwordStrength.color : ''"></div>
          <div class="strength-bar" [class.active]="passwordStrength.level >= 2" [style.background]="passwordStrength.level >= 2 ? passwordStrength.color : ''"></div>
          <div class="strength-bar" [class.active]="passwordStrength.level >= 3" [style.background]="passwordStrength.level >= 3 ? passwordStrength.color : ''"></div>
        </div>
        <span class="strength-label" [style.color]="passwordStrength.color">{{ passwordStrength.label }}</span>
      </div>

      <div class="input-group" [class.has-error]="resetForm.get('confirmPassword')?.touched && resetForm.hasError('passwordMismatch')">
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          id="confirm-password"
          formControlName="confirmPassword"
          placeholder=" "
          autocomplete="new-password"
        />
        <label for="confirm-password">Confirm password</label>
        <button type="button" class="eye-toggle" (click)="toggleConfirmPassword()" aria-label="Toggle password visibility">
          <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
        <small *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.get('confirmPassword')?.hasError('required')">
          Please confirm your password
        </small>
        <small *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.hasError('passwordMismatch') && !resetForm.get('confirmPassword')?.hasError('required')">
          Passwords do not match
        </small>
      </div>

      <button
        type="submit"
        class="btn-gradient"
        [disabled]="resetForm.invalid || loading"
        [class.loading]="loading"
      >
        <span *ngIf="!loading">Reset Password</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <a routerLink="/login" class="back-link">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to Login
    </a>
  </div>
</div>
